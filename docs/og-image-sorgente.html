<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Sorgente dell'immagine Open Graph</title>
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;}
  body{font-family:"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#1f379b 0%,#2d4fd6 65%,#6b86f0 130%);color:#fff;display:flex;align-items:center;padding:0 90px;box-sizing:border-box;position:relative;}
  .txt{max-width:700px}
  .tag{display:inline-block;background:rgba(255,255,255,.16);border-radius:30px;padding:10px 24px;font-size:26px;margin-bottom:28px}
  h1{font-size:84px;line-height:1.05;margin:0 0 22px;letter-spacing:-2px}
  p{font-size:34px;margin:0;color:#dfe6ff}
  .av{position:absolute;right:90px;top:50%;transform:translateY(-50%);width:300px;height:300px}
  .dot{position:absolute;right:60px;top:60px;width:110px;height:110px;border-radius:50%;background:#f2a541}
</style></head><body>
  <div class="dot"></div>
  <div class="txt">
    <div class="tag">Portfolio</div>
    <h1>Andrea Viani</h1>
    <p>Siti web e AI per le imprese · Lucca, Versilia e tutta Italia</p>
  </div>
  <img class="av" src="../img/avatar.svg" alt="">
</body></html>
