  </defs>
  <rect width="480" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="400" cy="70" r="46" fill="#f2a541" opacity=".9"/>
  <circle cx="70" cy="380" r="64" fill="#2d4fd6" opacity=".12"/>

